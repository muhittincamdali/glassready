<text class="t" x="20" y="751" style="animation-delay:4.38s"><tspan fill="#0071E3" font-weight="700">INFO     </tspan><tspan fill="#00285C" font-weight="700">GLS202 UIKit view inside Flutter</tspan></text>
<text class="t" x="20" y="770" style="animation-delay:4.42s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">lib/main.dart:85</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:4.46s"><tspan fill="#0B1F33">         A UiKitView embeds a native iOS view.</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.49s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [C] Check the native view next to the Flutter UI</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:4.53s"></text>
<text class="t" x="20" y="846" style="animation-delay:4.56s"><tspan fill="#00285C" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:4.59s"></text>
<text class="t" x="20" y="884" style="animation-delay:4.63s"><tspan fill="#00285C" font-weight="700">[A]      </tspan><tspan fill="#00285C" font-weight="700">Remove the opt-out and review the screens with Liquid Glass</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.67s"><tspan fill="#0B1F33">         1. Delete the UIDesignRequiresCompatibility key from the Info.plist.</tspan></text>
<text class="t" x="20" y="922" style="animation-delay:4.70s"><tspan fill="#0B1F33">         2. Build with Xcode 27 and run the app on an iOS 27 simulator; the other findings in this</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:4.73s"><tspan fill="#0B1F33">            report are the places to look at first.</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:4.77s"><tspan fill="#0B1F33">         3. Keep the brand colour on tint (buttons, selected tab) rather than on bar backgrounds, so</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:4.80s"><tspan fill="#0B1F33">            the system can draw the bars.</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:4.84s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/opt-out.md</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:4.88s"></text>
<text class="t" x="20" y="1036" style="animation-delay:4.91s"><tspan fill="#00285C" font-weight="700">[B]      </tspan><tspan fill="#00285C" font-weight="700">Decide whether the Cupertino bars should follow the system</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:4.95s"><tspan fill="#0B1F33">         1. Run the app on an iOS 27 simulator next to a system app and decide whether the</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:4.98s"><tspan fill="#0B1F33">            Flutter-drawn bars may look different.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:5.02s"><tspan fill="#0B1F33">         2. To follow the system, restyle the bars yourself (translucent background, floating tab</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:5.05s"><tspan fill="#0B1F33">            bar) or follow flutter/flutter#170310 for framework support.</tspan></text>
<text class="t" x="20" y="1131" style="animation-delay:5.08s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:5.12s"></text>
<text class="t" x="20" y="1169" style="animation-delay:5.16s"><tspan fill="#00285C" font-weight="700">[C]      </tspan><tspan fill="#00285C" font-weight="700">Check the native view next to the Flutter UI</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:5.19s"><tspan fill="#0B1F33">         1. Open the screen with the platform view on an iOS 27 simulator and compare its controls</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:5.22s"><tspan fill="#0B1F33">            with the Flutter widgets around it.</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:5.26s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/flutter.md</tspan></text>
<text class="t" x="20" y="1245" style="animation-delay:5.29s"></text>
