an class="t" style="animation-delay:1.93s">r</tspan><tspan class="t" style="animation-delay:1.98s">n</tspan><tspan class="t" style="animation-delay:2.02s">-</tspan><tspan class="t" style="animation-delay:2.06s">0</tspan><tspan class="t" style="animation-delay:2.11s">8</tspan><tspan class="t" style="animation-delay:2.15s">8</tspan><tspan class="t" style="animation-delay:2.20s">-</tspan><tspan class="t" style="animation-delay:2.25s">j</tspan><tspan class="t" style="animation-delay:2.29s">s</tspan><tspan class="t" style="animation-delay:2.33s">-</tspan><tspan class="t" style="animation-delay:2.38s">t</tspan><tspan class="t" style="animation-delay:2.42s">a</tspan><tspan class="t" style="animation-delay:2.47s">b</tspan><tspan class="t" style="animation-delay:2.51s">s</tspan></tspan></text>
<text class="t" x="20" y="105" style="animation-delay:3.06s"><tspan fill="#5A6B80">glassready 0.1.0 · rules liquid-glass@2026.10.27</tspan></text>
<text class="t" x="20" y="124" style="animation-delay:3.10s"></text>
<text class="t" x="20" y="143" style="animation-delay:3.13s"><tspan fill="#00285C" font-weight="700">Greenline</tspan><tspan fill="#0B1F33"> · React Native · fixtures/rn-088-js-tabs</tspan></text>
<text class="t" x="20" y="162" style="animation-delay:3.17s"><tspan fill="#5A6B80">project settings last updated by Xcode 12.1 · deployment target iOS 15.1</tspan></text>
<text class="t" x="20" y="181" style="animation-delay:3.20s"><tspan fill="#5A6B80">react-native 0.88.1 (declared)</tspan></text>
<text class="t" x="20" y="200" style="animation-delay:3.23s"><tspan fill="#5A6B80">react-native-screens 4.30.0 (declared)</tspan></text>
<text class="t" x="20" y="219" style="animation-delay:3.27s"><tspan fill="#5A6B80">@react-navigation/native-stack 7.21.0 (declared)</tspan></text>
<text class="t" x="20" y="238" style="animation-delay:3.31s"><tspan fill="#5A6B80">@react-navigation/bottom-tabs 7.21.0 (declared)</tspan></text>
<text class="t" x="20" y="257" style="animation-delay:3.34s"><tspan fill="#5A6B80">target HelloWorld: opts out of Liquid Glass (ios/HelloWorld/Info.plist)</tspan></text>
<text class="t" x="20" y="276" style="animation-delay:3.38s"></text>
<text class="t" x="20" y="295" style="animation-delay:3.41s"><tspan fill="#00285C" font-weight="700">The Liquid Glass opt-out is ignored when built with the iOS 27 SDK; 1 custom style to review first</tspan></text>
<text class="t" x="20" y="314" style="animation-delay:3.45s"><tspan fill="#5A6B80">Impact: high (60 of 100)</tspan></text>
<text class="t" x="20" y="333" style="animation-delay:3.48s"></text>
<text class="t" x="20" y="352" style="animation-delay:3.52s"><tspan fill="#00285C" font-weight="700">ERROR    </tspan><tspan fill="#00285C" font-weight="700">GLS001 Liquid Glass opt-out that the iOS 27 SDK ignores</tspan></text>
<text class="t" x="20" y="371" style="animation-delay:3.55s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">ios/HelloWorld/Info.plist:57</tspan></text>
<text class="t" x="20" y="390" style="animation-delay:3.58s"><tspan fill="#0B1F33">         HelloWorld: UIDesignRequiresCompatibility is YES in the Info.plist.</tspan></text>
<text class="t" x="20" y="409" style="animation-delay:3.62s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [A] Remove the opt-out and review the screens with Liquid Glass</tspan></text>
<text class="t" x="20" y="428" style="animation-delay:3.66s"></text>
<text class="t" x="20" y="447" style="animation-delay:3.69s"><tspan fill="#0058D4" font-weight="700">WARNING  </tspan><tspan fill="#00285C" font-weight="700">GLS101 Native stack header with its own background</tspan></text>
<text class="t" x="20" y="466" style="animation-delay:3.73s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:54</tspan></text>
<text class="t" x="20" y="485" style="animation-delay:3.76s"><tspan fill="#0B1F33">         headerStyle.backgroundColor paints the header.</tspan></text>
<text class="t" x="20" y="504" style="animation-delay:3.79s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [B] Leave the header background to the system on iOS</tspan></text>
<text class="t" x="20" y="523" style="animation-delay:3.83s"></text>
<text class="t" x="20" y="542" style="animation-delay:3.87s"><tspan fill="#0071E3" font-weight="700">INFO     </tspan><tspan fill="#00285C" font-weight="700">GLS008 Fixed bar height or safe-area arithmetic</tspan></text>
<text class="t" x="20" y="561" style="animation-delay:3.90s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:37</tspan></text>
<text class="t" x="20" y="580" style="animation-delay:3.94s"><tspan fill="#0B1F33">         A tab bar height written as a number.</tspan></text>
<text class="t" x="20" y="599" style="animation-delay:3.97s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [C] Use the bar's measured height</tspan></text>
<text class="t" x="20" y="618" style="animation-delay:4.00s"></text>
<text class="t" x="20" y="637" style="animation-delay:4.04s"><tspan fill="#0071E3" font-weight="700">INFO     </tspan><tspan fill="#00285C" font-weight="700">GLS102 Tab bar drawn in JavaScript</tspan></text>
<text class="t" x="20" y="656" style="animation-delay:4.08s"><tspan fill="#0B1F33">         </tspan><tspan fill="#0058D4">App.tsx:29</tspan></text>
<text class="t" x="20" y="675" style="animation-delay:4.11s"><tspan fill="#0B1F33">         createBottomTabNavigator draws the tab bar in JavaScript.</tspan></text>
<text class="t" x="20" y="694" style="animation-delay:4.15s"><tspan fill="#0B1F33">         </tspan><tspan fill="#00285C" font-weight="700">Fix: [D] Move to the native bottom tabs, or keep the JavaScript bar on purpose</tspan></text>
<text class="t" x="20" y="713" style="animation-delay:4.18s"></text>
<text class="t" x="20" y="732" style="animation-delay:4.21s"><tspan fill="#00285C" font-weight="700">How to fix</tspan></text>
<text class="t" x="20" y="751" style="animation-delay:4.25s"></text>
<text class="t" x="20" y="770" style="animation-delay:4.29s"><tspan fill="#00285C" font-weight="700">[A]      </tspan><tspan fill="#00285C" font-weight="700">Remove the opt-out and review the screens with Liquid Glass</tspan></text>
<text class="t" x="20" y="789" style="animation-delay:4.32s"><tspan fill="#0B1F33">         1. Delete the UIDesignRequiresCompatibility key from the Info.plist.</tspan></text>
<text class="t" x="20" y="808" style="animation-delay:4.36s"><tspan fill="#0B1F33">         2. Build with Xcode 27 and run the app on an iOS 27 simulator; the other findings in this</tspan></text>
<text class="t" x="20" y="827" style="animation-delay:4.39s"><tspan fill="#0B1F33">            report are the places to look at first.</tspan></text>
<text class="t" x="20" y="846" style="animation-delay:4.43s"><tspan fill="#0B1F33">         3. Keep the brand colour on tint (buttons, selected tab) rather than on bar backgrounds, so</tspan></text>
<text class="t" x="20" y="865" style="animation-delay:4.46s"><tspan fill="#0B1F33">            the system can draw the bars.</tspan></text>
<text class="t" x="20" y="884" style="animation-delay:4.50s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/opt-out.md</tspan></text>
<text class="t" x="20" y="903" style="animation-delay:4.53s"></text>
<text class="t" x="20" y="922" style="animation-delay:4.57s"><tspan fill="#00285C" font-weight="700">[B]      </tspan><tspan fill="#00285C" font-weight="700">Leave the header background to the system on iOS</tspan></text>
<text class="t" x="20" y="941" style="animation-delay:4.60s"><tspan fill="#0B1F33">         1. Set headerStyle.backgroundColor, headerBackground and headerBlurEffect only for Android</tspan></text>
<text class="t" x="20" y="960" style="animation-delay:4.63s"><tspan fill="#0B1F33">            (Platform.select) or for iOS before 26.</tspan></text>
<text class="t" x="20" y="979" style="animation-delay:4.67s"><tspan fill="#0B1F33">         2. Keep the brand colour on headerTintColor.</tspan></text>
<text class="t" x="20" y="998" style="animation-delay:4.71s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/react-native-expo.md</tspan></text>
<text class="t" x="20" y="1017" style="animation-delay:4.74s"></text>
<text class="t" x="20" y="1036" style="animation-delay:4.78s"><tspan fill="#00285C" font-weight="700">[C]      </tspan><tspan fill="#00285C" font-weight="700">Use the bar's measured height</tspan></text>
<text class="t" x="20" y="1055" style="animation-delay:4.81s"><tspan fill="#0B1F33">         1. Remove the fixed height and read the height the navigator measures</tspan></text>
<text class="t" x="20" y="1074" style="animation-delay:4.85s"><tspan fill="#0B1F33">            (useBottomTabBarHeight, useHeaderHeight) or the safe-area insets.</tspan></text>
<text class="t" x="20" y="1093" style="animation-delay:4.88s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/react-native-expo.md</tspan></text>
<text class="t" x="20" y="1112" style="animation-delay:4.92s"></text>
<text class="t" x="20" y="1131" style="animation-delay:4.95s"><tspan fill="#00285C" font-weight="700">[D]      </tspan><tspan fill="#00285C" font-weight="700">Move to the native bottom tabs, or keep the JavaScript bar on purpose</tspan></text>
<text class="t" x="20" y="1150" style="animation-delay:4.99s"><tspan fill="#0B1F33">         1. For the system tab bar, use createNativeBottomTabNavigator from</tspan></text>
<text class="t" x="20" y="1169" style="animation-delay:5.02s"><tspan fill="#0B1F33">            @react-navigation/bottom-tabs/unstable (React Native 0.79 or later, react-native-screens</tspan></text>
<text class="t" x="20" y="1188" style="animation-delay:5.05s"><tspan fill="#0B1F33">            4.30.0 or later).</tspan></text>
<text class="t" x="20" y="1207" style="animation-delay:5.09s"><tspan fill="#0B1F33">         2. If the custom bar is part of the brand, keep it and check it next to the Liquid Glass</tspan></text>
<text class="t" x="20" y="1226" style="animation-delay:5.13s"><tspan fill="#0B1F33">            headers on an iOS 27 simulator.</tspan></text>
<text class="t" x="20" y="1245" style="animation-delay:5.16s"><tspan fill="#0B1F33">         </tspan><tspan fill="#5A6B80">https://github.com/muhittincamdali/glassready/blob/main/docs/guides/react-native-expo.md</tspan></text>
<text class="t" x="20" y="1264" style="animation-delay:5.20s"></text>
<text class="t" x="20" y="1283" style="animation-delay:5.23s"><tspan fill="#00285C" font-weight="700">1 error, 1 warning, 2 info</tspan></text>
<text class="t" x="20" y="1302" style="animation-delay:5.27s"><tspan fill="#0B1F33">Guide: https://github.com/muhittincamdali/glassready/blob/main/docs/guides/react-native-expo.md</tspan></text>
<text class="t" x="20" y="1321" style="animation-delay:5.30s"><tspan fill="#5A6B80">Will it launch with the iOS 27 SDK? npx @mcamdali/sdkbump (https://github.com/muhittincamdali/sdkbump)</tspan></text>
<text class="t" x="20" y="1340" style="animation-delay:5.54s"><tspan fill="#0071E3" font-weight="700">$ </tspan></text>
<rect class="caret" x="35.66" y="1328" width="7.83" height="16" fill="#0071E3" style="animation-delay:5.54s"/>
