name: Trailhead
options:
  bundleIdPrefix: dev.glassready.fixtures
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Trailhead:
    type: application
    platform: iOS
    sources:
      - Trailhead
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.glassready.fixtures.trailhead
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Trailhead
        INFOPLIST_KEY_UIDesignRequiresCompatibility: "YES"
